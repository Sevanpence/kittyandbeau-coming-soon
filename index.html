<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Oh, just you wait... It's going to be Beau-nanas!">
  <title>Kitty & Beau — Beau-nanas!</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 22px 12px 35px;
      background: white;
      color: black;
      font-family: "Comic Sans MS", "Comic Sans", cursive, sans-serif;
      text-align: center;
    }
    main { max-width: 800px; margin: 0 auto; }
    .tiny { margin: 0 0 24px; color: #8c00c8; font-size: 17px; font-weight: bold; transform: rotate(-3deg); }
    h1 { margin: 0; font-size: clamp(30px, 7vw, 56px); line-height: 1.15; font-weight: 900; color: #1111dc; transform: rotate(-2deg); }
    .next { margin: 18px 0 5px; font-size: clamp(25px, 5vw, 39px); font-weight: bold; transform: rotate(2deg); }
    .big { margin: 7px 0 0; font-size: clamp(42px, 10vw, 89px); line-height: 1.1; font-weight: 900; letter-spacing: -2px; color: #f30b9e; transform: rotate(-3deg); }
    .big span { color: #d9ad00; }
    .drawing { display: block; width: min(100%, 650px); margin: 1px auto 0; height: auto; }
    .bottom { margin: -5px 0 0; font-size: clamp(20px, 4.5vw, 29px); color: #0f912f; font-weight: bold; transform: rotate(3deg); }
    @media (max-width: 440px) {
      body { padding-top: 24px; }
      .tiny { margin-bottom: 28px; }
      .next { margin-top: 21px; }
      .drawing { margin-top: 18px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="tiny">KITTY + BEAU :)</p>
    <h1>Oh, just you wait...</h1>
    <p class="next">It's going to be</p>
    <p class="big">BEAU<span>-</span>NANAS!</p>

    <!-- Intentionally terrible mouse-drawn MS Paint art. -->
    <svg class="drawing" viewBox="0 0 650 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A hilariously badly drawn smiling yellow banana with stick arms, a lopsided sun, and wonky stars">
      <!-- sun: a yellow circle drawn very badly -->
      <path d="M505 40 L505 16 M541 47 L558 30 M553 79 L583 81 M544 108 L559 125 M501 118 L498 143 M464 110 L445 125 M449 76 L421 73 M462 45 L444 30" fill="none" stroke="#f4a900" stroke-width="5" stroke-linecap="round"/>
      <path d="M469 47 L489 35 L520 40 L540 61 L542 86 L525 111 L497 116 L469 108 L453 85 L453 64 Z" fill="#ffe200" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
      <path d="M482 71 L488 73 M515 72 L519 71 M486 92 L496 98 L511 94" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>

      <!-- a star drawn with the mouse, and not very well -->
      <path d="M113 93 L120 117 L149 119 L128 137 L132 165 L113 149 L86 159 L94 137 L74 118 L105 118 Z" fill="#ff37b6" stroke="#0012f6" stroke-width="5" stroke-linejoin="round"/>
      <path d="M566 229 L572 247 L594 244 L584 264 L596 282 L574 277 L564 296 L557 270 L534 270 L551 257 Z" fill="#08d5fb" stroke="#1a23e9" stroke-width="4" stroke-linejoin="round"/>

      <!-- very badly shaped banana -->
      <path d="M175 96 L195 100 L206 137 L222 164 L244 190 L273 210 L307 222 L344 219 L370 209 L397 185 L411 167 L412 205 L396 242 L368 271 L323 292 L283 293 L242 277 L210 253 L191 220 L177 184 L170 149 Z" fill="#ffe400" stroke="#000" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M177 96 L173 79 L183 69 L197 72 L195 103 Z" fill="#76512c" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
      <path d="M412 168 L425 161 L425 180 L412 207 Z" fill="#76512c" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
      <path d="M190 150 L202 191 L225 228 M235 248 L264 270" fill="none" stroke="#f2ab00" stroke-width="6" stroke-linecap="round"/>
      <!-- silly uneven eyes -->
      <circle cx="280" cy="237" r="14" fill="#fff" stroke="#000" stroke-width="5"/>
      <circle cx="324" cy="238" r="12" fill="#fff" stroke="#000" stroke-width="5"/>
      <circle cx="283" cy="239" r="5" fill="black"/>
      <circle cx="321" cy="242" r="6" fill="black"/>
      <path d="M289 260 L300 270 L314 266 L323 259" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round"/>
      <!-- stick arms, legs, shoes -->
      <path d="M207 224 L155 210 L139 185 M155 210 L130 222 M365 265 L418 256 L440 232 M418 256 L445 262 M278 292 L257 332 L232 341 M319 293 L344 333 L369 334" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- hand-drawn arrow and annotation -->
      <path d="M102 246 L163 258 M143 241 L165 260 L138 271" fill="none" stroke="red" stroke-width="5" stroke-linecap="round"/>
      <text x="21" y="238" transform="rotate(-12 21 238)" fill="red" font-size="23" font-weight="bold" font-family="Comic Sans MS, cursive">banana!!</text>
      <!-- random childish lines -->
      <path d="M74 350 L102 337 L130 351 L162 340 M472 353 L498 345 L525 353 L554 340" fill="none" stroke="#15b518" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <p class="bottom">coming soon!!!!</p>
  </main>
</body>
</html>
